<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כנסת 16 – תוצאות</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.04);
  --bloc-right: #2a78d6;
  --bloc-haredi: #eb6834;
  --bloc-center_left: #1baf7a;
  --bloc-arab: #eda100;
  --bloc-other: #b9b8b1;
  --on-right: #ffffff;
  --on-haredi: #ffffff;
  --on-center_left: #ffffff;
  --on-arab: #0b0b0b;
  --on-other: #0b0b0b;
  --good: #006300;
  --critical: #d03b3b;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --bloc-right: #3987e5;
    --bloc-haredi: #d95926;
    --bloc-center_left: #199e70;
    --bloc-arab: #c98500;
    --bloc-other: #5a5955;
    --on-other: #f0efec;
    --good: #0ca30c;
    --critical: #e66767;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --ring: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05);
  --bloc-right: #3987e5;
  --bloc-haredi: #d95926;
  --bloc-center_left: #199e70;
  --bloc-arab: #c98500;
  --bloc-other: #5a5955;
  --on-other: #f0efec;
  --good: #0ca30c;
  --critical: #e66767;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; margin: 0 0 4px; }
h2 { font-size: 19px; margin: 0 0 12px; }
.sub { color: var(--ink-2); margin: 0 0 20px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 20px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 3px; }
.tabs button, .seg button {
  border: 0; background: transparent; color: var(--ink-2); font: inherit;
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
}
.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; gap: 2px; border: 1px solid var(--ring); border-radius: 10px; padding: 3px; background: var(--surface); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 600; }
.tile .note { color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 13px; margin: 8px 0 12px; }
.legend span::before {
  content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  background: var(--sw); margin-inline-end: 6px; vertical-align: -1px;
}
.stack { position: relative; display: flex; gap: 2px; height: 40px; }
.stack .seg-fill {
  height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-size: 13px; font-weight: 600; white-space: nowrap; min-width: 0;
}
.stack .seg-fill:first-child { border-start-start-radius: 4px; border-end-start-radius: 4px; }
.stack .seg-fill:last-of-type { border-start-end-radius: 4px; border-end-end-radius: 4px; }
.majority { position: absolute; top: -6px; bottom: -6px; width: 0; border-inline-start: 2px dashed var(--ink); pointer-events: none; }
.majority span { position: absolute; top: -20px; transform: translateX(50%); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.stack-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px 12px; align-items: center; margin-top: 24px; }
.stack-rows .row-label { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.bars { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 6px 10px; align-items: center; }
.bars .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .track { height: 18px; display: flex; align-items: center; gap: 8px; }
.bars .fill { height: 100%; border-start-end-radius: 4px; border-end-end-radius: 4px; min-width: 2px; }
.bars .num { font-variant-numeric: tabular-nums; font-weight: 600; text-align: start; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; text-align: start; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
td.n { font-variant-numeric: tabular-nums; }
tr.dim td { color: var(--muted); }
tr.total td { font-weight: 600; border-top: 1px solid var(--axis); }
.share-cell { display: flex; align-items: center; gap: 8px; min-width: 220px; }
.share-cell .val { width: 56px; font-variant-numeric: tabular-nums; }
.share-track { position: relative; flex: 1; height: 12px; }
.share-track .fill { height: 100%; background: var(--accent); border-start-end-radius: 4px; border-end-end-radius: 4px; min-width: 1px; }
tr.dim .share-track .fill { background: var(--axis); }
.share-track .thr { position: absolute; top: -3px; bottom: -3px; border-inline-start: 2px solid var(--critical); }
.status { font-weight: 600; }
.status.ok { color: var(--good); }
.status.no { color: var(--critical); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.more { margin-top: 10px; font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px 0; }
.notes { color: var(--ink-2); font-size: 13px; }
.notes p { margin: 4px 0; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.checks label { cursor: pointer; }
#tip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: 260px;
}
#tip b { display: block; margin-bottom: 2px; }
.combo { position: relative; max-width: 560px; }
.text-input {
  width: 100%; font: inherit; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--axis); background: var(--surface); color: var(--ink);
}
.combo ul {
  position: absolute; z-index: 5; inset-inline: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
  list-style: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); max-height: 380px; overflow-y: auto;
}
.combo li { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.combo li[aria-selected="true"], .combo li:hover { background: var(--wash); }
.combo li.empty { cursor: default; color: var(--ink-2); }
.meta { display: block; color: var(--ink-2); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips button {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); cursor: pointer;
  border: 1px solid var(--ring); border-radius: 999px; padding: 4px 12px;
}
.chips button:hover { background: var(--wash); }
.ballot { font-weight: 700; border: 1px solid var(--axis); border-radius: 4px; padding: 0 5px; font-size: 13px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th[aria-sort]::after { content: " ▼"; font-size: 10px; }
th[aria-sort="ascending"]::after { content: " ▲"; }
.sticky { position: sticky; inset-inline-start: 0; background: var(--surface); z-index: 1; }
.set-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.set-controls .text-input { max-width: 260px; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  h1 { font-size: 22px; }
  .tile .value { font-size: 20px; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .stack-rows { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .stack-rows .row-label { margin-top: 10px; }
  .bars { grid-template-columns: minmax(80px, 120px) 1fr; }
}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="toolbar" id="toolbar" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="election" aria-selected="true">תוצאות לפי כנסת</button>
      <button role="tab" data-view="compare" aria-selected="false">השוואה בין כנסות</button>
      <button role="tab" data-view="party" aria-selected="false">חיפוש מפלגה</button>
    </div>
    <label id="knesset-picker">כנסת:
      <select id="knesset-select"></select>
    </label>
  </div>

  <section id="view-election"></section>

  <section id="view-compare" hidden>
    <div class="card">
      <h2>הגדרות השוואה</h2>
      <div class="toolbar" style="margin-bottom: 8px">
        <div class="seg" id="group-seg">
          <button data-group="bloc" aria-pressed="true">לפי גושים</button>
          <button data-group="family" aria-pressed="false">לפי מפלגות</button>
        </div>
        <div class="seg" id="metric-seg">
          <button data-metric="seats" aria-pressed="true">מנדטים</button>
          <button data-metric="share" aria-pressed="false">אחוז קולות</button>
        </div>
      </div>
      <div class="checks" id="compare-checks"></div>
      <p class="notes">הממוצע מחושב על הכנסות המסומנות. במפלגות, הממוצע הוא רק על הכנסות שבהן המפלגה רצה, ומספרן מופיע בעמודה "כנסות".</p>
    </div>
    <div class="card" id="compare-chart-card">
      <h2 id="compare-chart-title"></h2>
      <div class="legend" id="compare-legend"></div>
      <div class="stack-rows" id="compare-chart"></div>
    </div>
    <div class="card">
      <h2 id="compare-table-title"></h2>
      <div class="table-wrap"><table id="compare-table"></table></div>
    </div>
  </section>

  <section id="view-party" hidden>
    <div class="card">
      <h2>חיפוש לפי פתק, שם מפלגה או מספר 1</h2>
      <div class="combo">
        <input id="party-q" class="text-input" type="search" role="combobox" autocomplete="off"
          aria-expanded="false" aria-controls="party-list" aria-autocomplete="list" aria-label="חיפוש מפלגה"
          placeholder="למשל מחל, אמת, שס או נתניהו">
        <ul id="party-list" role="listbox" hidden></ul>
      </div>
      <div class="chips" id="party-chips"></div>
    </div>
    <div id="party-detail"></div>
  </section>

  <div class="notes card" id="footer"></div>
</main>
<div id="tip" role="tooltip"></div>

<script>
const DATA = {"multi":false,"elections":[{"knesset":16,"year":2003,"date":"2003-01-28","threshold":0.015,"source":"regular_boxes_only","provisional":false,"seats_total":120,"surplus_agreements":[["העבודה-מימד","מרצ"],["שינוי","רק"],["האיחוד הלאומי","ישראל בעלייה"],["המפד\"ל","עם אחד"],["ש\"ס","יהדות התורה"],["חד\"ש-תע\"ל","בל\"ד"]],"registered":4720075,"voters":3200773,"invalid":52409,"valid":3148364,"regular_boxes":7736,"envelope_rows":1,"parties":[{"letter":"מחל","name_he":"הליכוד","name_en":"Likud","family":"Likud","bloc":"right","leader":"","votes":925279,"share":0.293892,"passed":true,"seats":38},{"letter":"אמת","name_he":"העבודה-מימד","name_en":"Labor-Meimad","family":"Labor-Meimad","bloc":"center_left","leader":"","votes":455183,"share":0.144578,"passed":true,"seats":19},{"letter":"יש","name_he":"שינוי","name_en":"Shinui","family":"Shinui","bloc":"center_left","leader":"","votes":386535,"share":0.122773,"passed":true,"seats":15},{"letter":"שס","name_he":"ש\"ס","name_en":"Shas","family":"Shas","bloc":"haredi","leader":"","votes":258879,"share":0.082227,"passed":true,"seats":11},{"letter":"ל","name_he":"האיחוד הלאומי","name_en":"National Union","family":"National Union","bloc":"right","leader":"","votes":173973,"share":0.055258,"passed":true,"seats":7},{"letter":"מרצ","name_he":"מרצ","name_en":"Meretz","family":"Meretz","bloc":"center_left","leader":"","votes":164122,"share":0.052129,"passed":true,"seats":6},{"letter":"ג","name_he":"יהדות התורה","name_en":"United Torah Judaism","family":"United Torah Judaism","bloc":"haredi","leader":"","votes":135087,"share":0.042907,"passed":true,"seats":5},{"letter":"ב","name_he":"המפד\"ל","name_en":"National Religious Party","family":"National Religious Party","bloc":"right","leader":"","votes":132370,"share":0.042044,"passed":true,"seats":6},{"letter":"ו","name_he":"חד\"ש-תע\"ל","name_en":"Hadash-Ta'al","family":"Hadash-Ta'al","bloc":"arab","leader":"","votes":93819,"share":0.029799,"passed":true,"seats":3},{"letter":"ם","name_he":"עם אחד","name_en":"One Nation","family":"One Nation","bloc":"center_left","leader":"","votes":86808,"share":0.027572,"passed":true,"seats":3},{"letter":"ד","name_he":"בל\"ד","name_en":"Balad","family":"Balad","bloc":"arab","leader":"","votes":71299,"share":0.022646,"passed":true,"seats":3},{"letter":"כן","name_he":"ישראל בעלייה","name_en":"Yisrael BaAliyah","family":"Yisrael BaAliyah","bloc":"right","leader":"","votes":67719,"share":0.021509,"passed":true,"seats":2},{"letter":"עם","name_he":"רע\"ם","name_en":"United Arab List (Ra'am)","family":"Ra'am","bloc":"arab","leader":"","votes":65551,"share":0.020821,"passed":true,"seats":2},{"letter":"קנ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":37855,"share":0.012024,"passed":false,"seats":0},{"letter":"נץ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":36202,"share":0.011499,"passed":false,"seats":0},{"letter":"צף","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":20571,"share":0.006534,"passed":false,"seats":0},{"letter":"רק","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":12833,"share":0.004076,"passed":false,"seats":0},{"letter":"נ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":6763,"share":0.002148,"passed":false,"seats":0},{"letter":"זנ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":5614,"share":0.001783,"passed":false,"seats":0},{"letter":"פה","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":2051,"share":0.000651,"passed":false,"seats":0},{"letter":"צ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":2033,"share":0.000646,"passed":false,"seats":0},{"letter":"ק","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":2014,"share":0.00064,"passed":false,"seats":0},{"letter":"קך","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":1593,"share":0.000506,"passed":false,"seats":0},{"letter":"ט","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":1265,"share":0.000402,"passed":false,"seats":0},{"letter":"קץ","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":1214,"share":0.000386,"passed":false,"seats":0},{"letter":"ז","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":890,"share":0.000283,"passed":false,"seats":0},{"letter":"ף","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":842,"share":0.000267,"passed":false,"seats":0},{"letter":"זך","name_he":"","name_en":"","family":"","bloc":"other","leader":"","votes":0,"share":0.0,"passed":false,"seats":0}]}]};

const BLOCS = [
  { id: "right", label: "ימין" },
  { id: "haredi", label: "חרדים" },
  { id: "center_left", label: "מרכז-שמאל" },
  { id: "arab", label: "ערבים" },
  { id: "other", label: "אחר" },
];
const BLOC_LABEL = Object.fromEntries(BLOCS.map(b => [b.id, b.label]));
const fmtInt = n => new Intl.NumberFormat("he-IL").format(n);
const fmtPct = (x, d = 2) => (x * 100).toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const blocVar = id => `var(--bloc-${id})`;
const partyName = p => p.name_he || `רשימה ${p.letter}`;

// ---------- tooltip ----------
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.innerHTML = el.dataset.tip;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
});

// ---------- aggregation ----------
function blocTotals(el) {
  const t = Object.fromEntries(BLOCS.map(b => [b.id, { votes: 0, seats: 0, share: 0, lists: [] }]));
  for (const p of el.parties) {
    const b = t[p.bloc];
    b.votes += p.votes; b.seats += p.seats; b.share += p.share;
    if (p.seats > 0) b.lists.push(p);
  }
  return t;
}

function stackBar(segments, total, opts = {}) {
  // segments: [{id, value, label, tipHtml}]
  let html = `<div class="stack">`;
  for (const s of segments) {
    if (s.value <= 0) continue;
    const w = (s.value / total) * 100;
    // fitLabels() later picks the longest label that fits the rendered width.
    html += `<div class="seg-fill" style="flex: 0 0 calc(${w}% - 2px); background: ${blocVar(s.id)}; color: var(--on-${s.id})"
      data-full="${esc(s.label)} ${esc(s.valueText)}" data-short="${esc(s.valueText)}" data-tip="${esc(s.tipHtml)}"></div>`;
  }
  if (opts.majority) {
    const pos = (opts.majority / total) * 100;
    const label = opts.majorityLabel === false ? "" : `<span>${opts.majority} – רוב</span>`;
    html += `<div class="majority" style="inset-inline-start: ${pos}%">${label}</div>`;
  }
  return html + `</div>`;
}

function fitLabels() {
  for (const el of document.querySelectorAll(".seg-fill[data-full]")) {
    const span = document.createElement("span");
    el.replaceChildren(span);
    for (const text of [el.dataset.full, el.dataset.short, ""]) {
      span.textContent = text;
      if (span.offsetWidth <= el.clientWidth - 8) break;
    }
  }
}
addEventListener("resize", fitLabels);

function blocLegend() {
  return BLOCS.map(b => `<span style="--sw: ${blocVar(b.id)}">${b.label}</span>`).join("");
}

// ---------- single election view ----------
function renderElection(el) {
  const blocs = blocTotals(el);
  const seated = el.parties.filter(p => p.seats > 0).sort((a, b) => b.seats - a.seats || b.votes - a.votes);
  const maxSeats = Math.max(...seated.map(p => p.seats));
  const thresholdVotes = Math.ceil(el.valid * el.threshold);

  const tiles = [
    ["בעלי זכות בחירה", fmtInt(el.registered), ""],
    ["מצביעים", fmtInt(el.voters), ""],
    ["אחוז הצבעה", fmtPct(el.voters / el.registered), ""],
    ["קולות כשרים", fmtInt(el.valid), ""],
    ["קולות פסולים", fmtInt(el.invalid), fmtPct(el.invalid / el.voters) + " מהמצביעים"],
    ["אחוז החסימה", fmtPct(el.threshold), fmtInt(thresholdVotes) + " קולות"],
    ["קלפיות", fmtInt(el.regular_boxes), "ועוד " + fmtInt(el.envelope_rows) + " שורות מעטפות כפולות"],
    ["רשימות", fmtInt(el.parties.length), seated.length + " עברו את אחוז החסימה"],
  ];

  const blocSegments = BLOCS.map(b => ({

  const sorted = [...el.parties].sort((a, b) => b.votes - a.votes);

      <div style="padding-top: 18px">${stackBar(blocSegments, el.seats_total, { majority: Math.floor(el.seats_total / 2) + 1 })}</div>
      <div class="table-wrap" style="margin-top: 16px"><table>
        <thead><tr><th>גוש</th><th>קולות</th><th>אחוז</th><th>מנדטים</th></tr></thead>
        <tbody>${blocRows}</tbody></table></div>
    </div>
    <div class="card">
      <h2>מנדטים לפי רשימות</h2>
      <div class="legend">${blocLegend()}</div>
      <div class="bars">${seatBars}</div>
    </div>
    <div class="card">
      <h2>אחוזי הצבעה לרשימות</h2>
      <p class="notes">הקו האדום מסמן את אחוז החסימה (${fmtPct(el.threshold)}). רשימות שלא עברו מוצגות באפור.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>רשימה</th><th>אותיות</th><th>גוש</th><th>קולות</th><th>אחוז מהכשרים</th><th>אחוז החסימה</th><th>מנדטים</th></tr></thead>
        <tbody>${rows}
          <tr class="total"><td>סה"כ</td><td></td><td></td><td class="n">${fmtInt(el.valid)}</td><td>100.00%</td><td></td><td class="n">${el.seats_total}</td></tr>
        </tbody></table></div>
      ${hiddenCount ? `<button class="more" id="show-all">הצג עוד ${hiddenCount} רשימות קטנות</button>` : ""}

  const more = document.getElementById("show-all");

    <p>הגושים הם חלוקה אידיאולוגית שנקבעה בקבצי <code>data/parties</code> ואפשר לשנות אותה שם. רשימות קטנות שלא זוהו משויכות ל"אחר".</p>

      ? "מקור: קובץ קלפיות של פרויקט Israel-Elections-Map, שנבנה מהחבילה הרשמית ב-data.gov.il. טבלת היישובים חושבה מסכום הקלפיות."
      : "מקור: קובצי התוצאות של ועדת הבחירות המרכזית (קלפיות ויישובים)."}</p>`;
}

// ---------- comparison view ----------
const compareState = { group: "bloc", metric: "seats", selected: new Set(DATA.elections.map(e => e.knesset)) };

function familyRows(elections) {
  // One row per party family; unnamed lists fold into "other lists".
  const rows = new Map();
  for (const el of elections) {
    for (const p of el.parties) {
      const key = p.family || "__other__";
      if (!rows.has(key)) rows.set(key, { key, label: key === "__other__" ? "רשימות אחרות" : partyName(p), bloc: p.bloc, values: {} });
      const r = rows.get(key);
      if (key !== "__other__") { r.label = partyName(p); r.bloc = p.bloc; }  // latest name wins
      const v = r.values[el.knesset] || { seats: 0, share: 0, votes: 0 };
      v.seats += p.seats; v.share += p.share; v.votes += p.votes;
      r.values[el.knesset] = v;
    }
  }
  return [...rows.values()];
}

function blocRowsAll(elections) {
  return BLOCS.map(b => ({
    key: b.id, label: b.label, bloc: b.id,
    values: Object.fromEntries(elections.map(el => {
      const t = blocTotals(el)[b.id];
      return [el.knesset, { seats: t.seats, share: t.share, votes: t.votes }];
    })),
  }));
}

function renderCompare() {
  const all = [...DATA.elections].sort((a, b) => a.knesset - b.knesset);
  const sel = all.filter(e => compareState.selected.has(e.knesset));
  const metric = compareState.metric;
  const fmt = v => metric === "seats" ? String(v) : fmtPct(v);
  const metricLabel = metric === "seats" ? "מנדטים" : "אחוז קולות";

  // Chart: one stacked bar per election, always by bloc (parties are too many series).
  document.getElementById("compare-chart-title").textContent = `${metricLabel} לפי גושים בכל כנסת`;
  document.getElementById("compare-legend").innerHTML = blocLegend();
  document.getElementById("compare-chart").innerHTML = all.map((el, i) => {
    const t = blocTotals(el);
    const total = metric === "seats" ? el.seats_total : 1;
    const segs = BLOCS.map(b => ({
      id: b.id, value: t[b.id][metric], label: b.label, valueText: fmt(t[b.id][metric]),
      tipHtml: `<b>${b.label} · כנסת ${el.knesset}</b>${t[b.id].seats} מנדטים · ${fmtPct(t[b.id].share)}`,
    }));
    const dim = compareState.selected.has(el.knesset) ? "" : ' style="opacity: 0.35"';
    return `<div class="row-label"${dim}>כנסת ${el.knesset} (${el.year})</div>
      <div${dim}>${stackBar(segs, total, metric === "seats" ? { majority: Math.floor(el.seats_total / 2) + 1, majorityLabel: i === 0 } : {})}</div>`;
  }).join("");

  // Table
  const rows = compareState.group === "bloc" ? blocRowsAll(all) : familyRows(all);
  for (const r of rows) {
    const vals = sel.map(el => r.values[el.knesset]).filter(Boolean);
    r.n = vals.length;
    r.avg = vals.length ? vals.reduce((s, v) => s + v[metric], 0) / vals.length : null;
  }
  if (compareState.group === "family") {
    rows.sort((a, b) => (a.key === "__other__") - (b.key === "__other__") || (b.avg ?? -1) - (a.avg ?? -1));
  }
  const fmtAvg = v => v == null ? "–" : (metric === "seats" ? v.toFixed(1) : fmtPct(v));
  const head = `<thead><tr><th>${compareState.group === "bloc" ? "גוש" : "מפלגה"}</th>` +
    all.map(el => `<th>כנסת ${el.knesset}</th>`).join("") + `<th>ממוצע</th><th>כנסות</th></tr></thead>`;
  const body = rows.map(r => `<tr><td><span class="dot" style="background: ${blocVar(r.bloc)}"></span>${esc(r.label)}</td>` +
    all.map(el => {
      const v = r.values[el.knesset];
      const off = compareState.selected.has(el.knesset) ? "" : ' style="color: var(--muted)"';
      return `<td class="n"${off}>${v ? fmt(v[metric]) : "–"}</td>`;
    }).join("") + `<td class="n"><b>${fmtAvg(r.avg)}</b></td><td class="n">${r.n}</td></tr>`).join("");
  document.getElementById("compare-table-title").textContent =
    `${metricLabel} ${compareState.group === "bloc" ? "לפי גושים" : "לפי מפלגות"} וממוצע על ${sel.length} כנסות`;
  document.getElementById("compare-table").innerHTML = head + `<tbody>${body}</tbody>`;
  fitLabels();
}

// ---------- party lookup ----------
const norm = s => String(s || "").toLowerCase().replace(/["'״׳\-–!.\s]/g, "");
const ELECTIONS_ASC = [...DATA.elections].sort((a, b) => a.knesset - b.knesset);
const lookupState = { entity: null, metric: "share", sortCol: null, sortDir: -1, filter: "", minValid: 200, limit: 30 };
let ENTITIES = null;

function knessetRange(nums) {
  // [16, 17, 18, 21] -> "16–18, 21"
  const parts = [];
  for (const n of nums) {
    const last = parts[parts.length - 1];
    if (last && n === last[1] + 1) last[1] = n; else parts.push([n, n]);
  }
  return parts.map(([a, b]) => a === b ? String(a) : `${a}–${b}`).join(", ");
}

function buildEntities() {
  // One entity per named party family; every unnamed list is its own entity.
  const ents = new Map();
  for (const el of ELECTIONS_ASC) for (const p of el.parties) {
    const key = p.family ? `f:${p.family}` : `u:${el.knesset}:${p.letter}`;
    if (!ents.has(key)) ents.set(key, { key, named: !!p.family, runs: [] });
    ents.get(key).runs.push({ el, p });
  }
  return [...ents.values()].map(e => {
    const last = e.runs[e.runs.length - 1];
    return Object.assign(e, {
      name: e.named ? partyName(last.p) : `רשימה ${last.p.letter} (כנסת ${last.el.knesset})`,
      bloc: last.p.bloc,
      leader: last.p.leader,
      letters: [...new Set(e.runs.map(r => r.p.letter))],
      knessets: [...new Set(e.runs.map(r => r.el.knesset))],
      maxVotes: Math.max(...e.runs.map(r => r.p.votes)),
      words: [...new Set(e.runs.flatMap(r => [r.p.name_he, r.p.name_en, r.p.leader]).filter(Boolean).map(norm))],
    });
  });
}

function searchEntities(query) {
  // Exact ballot letters first, then letter prefix, then name or leader substring.
  const q = norm(query);
  if (!q) return [];
  const scored = [];
  for (const e of ENTITIES) {
    const letters = e.letters.map(norm);
    const score = letters.includes(q) ? 3 : letters.some(l => l.startsWith(q)) ? 2 : e.words.some(w => w.includes(q)) ? 1 : 0;
    if (score) scored.push([score, e]);
  }
  const lastK = e => e.knessets[e.knessets.length - 1];
  scored.sort((a, b) => b[0] - a[0] || b[1].named - a[1].named || lastK(b[1]) - lastK(a[1]) || b[1].maxVotes - a[1].maxVotes);
  return scored.slice(0, 12).map(s => s[1]);
}

function entityMeta(e) {
  return `פתק ${e.letters.map(esc).join(", ")} · ${e.knessets.length === 1 ? "כנסת" : "כנסות"} ${knessetRange(e.knessets)}` +
    (e.leader ? ` · מספר 1: ${esc(e.leader)}` : "");
}

function renderSuggestions(list, active) {
  const ul = document.getElementById("party-list");
  const input = document.getElementById("party-q");
  ul.innerHTML = list.length ? list.map((e, i) => `
    <li role="option" id="party-opt-${i}" data-key="${esc(e.key)}" aria-selected="${i === active}">
      <span class="dot" style="background: ${blocVar(e.bloc)}"></span><b>${esc(e.name)}</b>
      <span class="meta">${entityMeta(e)}</span></li>`).join("")
    : `<li class="empty">לא נמצאה רשימה. נסו אותיות של פתק, שם מפלגה או שם של מספר 1.</li>`;
  ul.hidden = false;
  input.setAttribute("aria-expanded", "true");
  if (active >= 0) input.setAttribute("aria-activedescendant", `party-opt-${active}`);
  else input.removeAttribute("aria-activedescendant");
}

function closeSuggestions() {
  document.getElementById("party-list").hidden = true;
  document.getElementById("party-q").setAttribute("aria-expanded", "false");
}

function selectEntity(e) {
  document.getElementById("party-q").value = e.name;
  closeSuggestions();
  Object.assign(lookupState, { entity: e, sortCol: e.knessets[e.knessets.length - 1], sortDir: -1, filter: "", limit: 30 });
  renderParty(e);
}

function renderParty(e) {
  const runs = e.runs;
  const best = runs.reduce((a, r) => (r.p.seats > a.p.seats || (r.p.seats === a.p.seats && r.p.share > a.p.share)) ? r : a);
  const avgShare = runs.reduce((s, r) => s + r.p.share, 0) / runs.length;
  const passed = runs.filter(r => r.p.passed).length;
  const tiles = [
    ["מערכות בחירות", runs.length, `${e.knessets.length === 1 ? "כנסת" : "כנסות"} ${knessetRange(e.knessets)}`],
    ["עברה את אחוז החסימה", `${passed} מתוך ${runs.length}`, ""],
    ["אחוז ממוצע", fmtPct(avgShare), "על הכנסות שבהן רצה"],
    ["שיא מנדטים", best.p.seats, `כנסת ${best.el.knesset} (${best.el.year})`],
  ];
  const rows = runs.map(({ el, p }) => `
    <tr class="${p.passed ? "" : "dim"}">
      <td>כנסת ${el.knesset}</td><td class="n">${el.year}</td>
      <td><span class="ballot">${esc(p.letter)}</span></td>
      <td><span class="dot" style="background: ${blocVar(p.bloc)}"></span>${esc(partyName(p))}</td>
      <td>${p.leader ? esc(p.leader) : '<span style="color: var(--muted)">לא ידוע</span>'}</td>
      <td class="n">${fmtInt(p.votes)}</td><td class="n">${fmtPct(p.share)}</td>
      <td>${p.passed ? '<span class="status ok">✓ עברה</span>' : '<span class="status no">✗ לא עברה</span>'}</td>
      <td class="n">${p.seats}</td>
    </tr>`).join("");
  const related = ENTITIES.filter(x => x !== e && x.named && x.letters.some(l => e.letters.includes(l)))
    .sort((a, b) => b.knessets[b.knessets.length - 1] - a.knessets[a.knessets.length - 1]);
  const sub = [e.named && runs[runs.length - 1].p.name_en, `גוש: ${BLOC_LABEL[e.bloc]}`,
    e.leader ? `מספר 1 בכנסת ${runs[runs.length - 1].el.knesset}: ${e.leader}` : ""].filter(Boolean).map(esc).join(" · ");

  document.getElementById("party-detail").innerHTML = `
    <div class="card">
      <h2><span class="dot" style="background: ${blocVar(e.bloc)}"></span>${esc(e.name)}</h2>
      <p class="sub" style="margin-bottom: 12px">${sub}</p>
      <div class="tiles">${tiles.map(([l, v, n]) => `
        <div class="tile"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${n}</div></div>`).join("")}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>כנסת</th><th>שנה</th><th>פתק</th><th>שם הרשימה</th><th>מספר 1</th><th>קולות</th><th>אחוז</th><th>אחוז החסימה</th><th>מנדטים</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${related.length ? `<div class="chips" id="party-related"><span class="meta" style="width: 100%">רשימות אחרות עם אותו פתק:</span>` +
        related.map(x => `<button data-key="${esc(x.key)}"><span class="ballot">${x.letters.filter(l => e.letters.includes(l)).map(esc).join(", ")}</span> ${esc(x.name)} · ${x.knessets.length === 1 ? "כנסת" : "כנסות"} ${knessetRange(x.knessets)}</button>`).join("") + `</div>` : ""}
      ${e.named ? "" : '<p class="notes">שם הרשימה לא זוהה עדיין בטבלת המפלגות של הכנסת הזו.</p>'}
    </div>
    <div class="card">
      <h2>תוצאות לפי יישוב</h2>
      <p class="notes">החלק של הרשימה מהקולות הכשרים בכל יישוב. לחיצה על כותרת עמודה ממיינת לפיה. "–" פירושו שהיישוב לא הופיע באותה כנסת. השורה "מעטפות כפולות" היא קולות החיילים, הדיפלומטים, האסירים והמאושפזים, שנספרים בנפרד.</p>
      <div class="set-controls">
        <input id="set-filter" class="text-input" type="search" placeholder="סינון לפי שם יישוב" aria-label="סינון לפי שם יישוב">
        <div class="seg" id="set-metric">
          <button data-metric="share" aria-pressed="${lookupState.metric === "share"}">אחוז</button>
          <button data-metric="votes" aria-pressed="${lookupState.metric === "votes"}">קולות</button>
        </div>
        <label>גודל יישוב:
          <select id="set-min">${[[0, "כל היישובים"], [200, "200 קולות כשרים ומעלה"], [1000, "1,000 ומעלה"], [10000, "10,000 ומעלה"]]
            .map(([v, l]) => `<option value="${v}" ${v === lookupState.minValid ? "selected" : ""}>${l}</option>`).join("")}</select>
        </label>
      </div>
      <div class="table-wrap"><table id="set-table"></table></div>
      <button class="more" id="set-more" hidden></button>
    </div>`;

  const rel = document.getElementById("party-related");
  if (rel) rel.onclick = ev => {
    const b = ev.target.closest("button");
    if (b) { selectEntity(ENTITIES.find(x => x.key === b.dataset.key)); scrollTo({ top: 0 }); }
  };
  e.settlementRows ??= settlementRows(e);
  document.getElementById("set-filter").oninput = ev => {
    lookupState.filter = ev.target.value; lookupState.limit = 30; renderSettlements(e);
  };
  document.getElementById("set-min").onchange = ev => {
    lookupState.minValid = Number(ev.target.value); lookupState.limit = 30; renderSettlements(e);
  };
  document.getElementById("set-metric").onclick = ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    lookupState.metric = b.dataset.metric;
    document.querySelectorAll("#set-metric button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderSettlements(e);
  };
  document.getElementById("set-more").onclick = () => { lookupState.limit += 50; renderSettlements(e); };
  renderSettlements(e);
}

function settlementRows(e) {
  // One row per settlement code; cells keyed by Knesset (lists of one family in one
  // election are summed).
  const S = DATA.settlements;
  const rows = new Map();
  for (const { el, p } of e.runs) {
    const s = S.elections[el.knesset];
    const votes = s.votes[p.letter];
    s.codes.forEach((code, i) => {
      if (!rows.has(code)) rows.set(code, { code, name: S.names[code], cells: {}, maxValid: 0 });
      const row = rows.get(code);
      const cell = row.cells[el.knesset] ??= { votes: 0, valid: s.valid[i] };
      cell.votes += votes[i];
      row.maxValid = Math.max(row.maxValid, s.valid[i]);
    });
  }
  return [...rows.values()];
}

function renderSettlements(e) {
  const { metric, sortCol, sortDir, minValid } = lookupState;
  const q = norm(lookupState.filter);
  const val = c => !c ? null : metric === "share" ? (c.valid ? c.votes / c.valid : 0) : c.votes;
  const fmt = (c) => {
    if (!c) return "–";
    const tipText = `${fmtInt(c.votes)} קולות מתוך ${fmtInt(c.valid)} כשרים`;
    return `<span title="${tipText}">${metric === "share" ? fmtPct(val(c), 1) : fmtInt(c.votes)}</span>`;
  };
  let rows = e.settlementRows.filter(r => (q ? norm(r.name).includes(q) : r.maxValid >= minValid));
  rows.sort(sortCol === "name"
    ? (a, b) => sortDir * a.name.localeCompare(b.name, "he")
    : (a, b) => {
      const va = val(a.cells[sortCol]), vb = val(b.cells[sortCol]);
      if (va == null || vb == null) return (va == null) - (vb == null);  // missing cells last
      return sortDir * (va - vb);
    });
  const national = Object.fromEntries(e.runs.map(({ el }) => [el.knesset, { votes: 0, valid: el.valid }]));
  for (const { el, p } of e.runs) national[el.knesset].votes += p.votes;
  const ariaSort = col => sortCol === col ? ` aria-sort="${sortDir === -1 ? "descending" : "ascending"}"` : "";
  const cols = [...e.knessets].reverse();  // newest first, next to the name
  const head = `<thead><tr><th class="sticky sortable" data-col="name"${ariaSort("name")}>יישוב</th>` +
    cols.map(k => `<th class="sortable" data-col="${k}"${ariaSort(k)}>כנסת ${k}</th>`).join("") + `</tr></thead>`;
  const line = (name, cells, cls = "") => `<tr class="${cls}"><td class="sticky">${esc(name)}</td>` +
    cols.map(k => `<td class="n">${fmt(cells[k])}</td>`).join("") + `</tr>`;
  const shown = rows.slice(0, lookupState.limit);
  document.getElementById("set-table").innerHTML = head + `<tbody>` +
    line("כל הארץ", national, "total") + shown.map(r => line(r.name, r.cells)).join("") +
    (rows.length ? "" : `<tr><td class="sticky" colspan="${e.knessets.length + 1}">לא נמצא יישוב מתאים.</td></tr>`) + `</tbody>`;
  document.querySelectorAll("#set-table th.sortable").forEach(th => th.onclick = () => {
    const col = th.dataset.col === "name" ? "name" : Number(th.dataset.col);
    lookupState.sortDir = lookupState.sortCol === col ? -lookupState.sortDir : (col === "name" ? 1 : -1);
    lookupState.sortCol = col;
    renderSettlements(e);
  });
  const more = document.getElementById("set-more");
  const rest = rows.length - shown.length;
  more.hidden = rest <= 0;
  more.textContent = `הצג עוד ${Math.min(50, rest)} יישובים (מתוך ${fmtInt(rest)} נוספים)`;
}

function initLookup() {
  if (ENTITIES) return;
  ENTITIES = buildEntities();
  const input = document.getElementById("party-q");
  const ul = document.getElementById("party-list");
  let results = [], active = -1;
  input.oninput = () => {
    results = searchEntities(input.value);
    active = results.length ? 0 : -1;
    input.value.trim() ? renderSuggestions(results, active) : closeSuggestions();
  };
  input.onkeydown = ev => {
    if (ul.hidden && ev.key === "ArrowDown") { input.oninput(); return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!results.length) return;
      active = (active + (ev.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      renderSuggestions(results, active);
      document.getElementById(`party-opt-${active}`).scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter" && active >= 0) {
      ev.preventDefault();
      selectEntity(results[active]);
    } else if (ev.key === "Escape") {
      closeSuggestions();
    }
  };
  input.onblur = () => setTimeout(closeSuggestions, 150);
  ul.onmousedown = ev => {
    const li = ev.target.closest("li[data-key]");
    if (!li) return;
    ev.preventDefault();
    selectEntity(ENTITIES.find(x => x.key === li.dataset.key));
  };
  // Quick picks: the lists that won seats in the latest election.
  const latestEl = ELECTIONS_ASC[ELECTIONS_ASC.length - 1];
  const picks = latestEl.parties.filter(p => p.seats > 0 && p.family).sort((a, b) => b.seats - a.seats);
  document.getElementById("party-chips").innerHTML = `<span class="meta" style="width: 100%">רשימות הכנסת ה-${latestEl.knesset}:</span>` +
    picks.map(p => `<button data-key="${esc("f:" + p.family)}"><span class="ballot">${esc(p.letter)}</span> ${esc(partyName(p))}</button>`).join("");
  document.getElementById("party-chips").onclick = ev => {
    const b = ev.target.closest("button");
    if (b) selectEntity(ENTITIES.find(x => x.key === b.dataset.key));
  };
}

// ---------- wiring ----------
function showElection(knesset) {
  const el = DATA.elections.find(e => e.knesset === knesset);
  document.getElementById("title").textContent = `תוצאות הבחירות לכנסת ה-${el.knesset}`;
  document.getElementById("subtitle").textContent = el.provisional
    ? `${el.date} · תוצאות לא סופיות: הקבצים הורדו לפני פרסום התוצאות הרשמיות המאושרות`
    : `${el.date} · תוצאות סופיות לפי קובצי ועדת הבחירות`;
  renderElection(el);
  fitLabels();
}

function setView(view) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.getElementById("view-election").hidden = view !== "election";
  document.getElementById("view-compare").hidden = view !== "compare";
  document.getElementById("view-party").hidden = view !== "party";
  document.getElementById("knesset-picker").hidden = view !== "election";
  document.getElementById("footer").hidden = view !== "election";
  if (view === "compare") {
    document.getElementById("title").textContent = "השוואה בין כנסות";
    document.getElementById("subtitle").textContent = `${DATA.elections.length} מערכות בחירות · ממוצע לפי מפלגות או גושים`;
    renderCompare();
  } else if (view === "party") {
    document.getElementById("title").textContent = "חיפוש מפלגה";
    document.getElementById("subtitle").textContent =
      `לפי אותיות הפתק, שם המפלגה או מספר 1 · ${DATA.elections.length} מערכות בחירות, כנסות ${knessetRange(ELECTIONS_ASC.map(e => e.knesset))}`;
    initLookup();
  } else {
    showElection(Number(document.getElementById("knesset-select").value));
  }
}

const latest = Math.max(...DATA.elections.map(e => e.knesset));
if (DATA.multi) {
  document.getElementById("toolbar").hidden = false;
  const select = document.getElementById("knesset-select");
  select.innerHTML = [...DATA.elections].sort((a, b) => b.knesset - a.knesset)
    .map(e => `<option value="${e.knesset}">כנסת ${e.knesset} (${e.year})</option>`).join("");
  select.onchange = () => showElection(Number(select.value));
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
  document.getElementById("compare-checks").innerHTML = [...DATA.elections].sort((a, b) => a.knesset - b.knesset)
    .map(e => `<label><input type="checkbox" value="${e.knesset}" checked> כנסת ${e.knesset}</label>`).join("");
  document.getElementById("compare-checks").onchange = ev => {
    const k = Number(ev.target.value);
    ev.target.checked ? compareState.selected.add(k) : compareState.selected.delete(k);
    renderCompare();
  };
  for (const [segId, key] of [["group-seg", "group"], ["metric-seg", "metric"]]) {
    document.getElementById(segId).onclick = ev => {
      const b = ev.target.closest("button");
      if (!b) return;
      compareState[key] = b.dataset[key];
      document.querySelectorAll(`#${segId} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
      renderCompare();
    };
  }
}
showElection(latest);
</script>
